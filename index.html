    <!-- ══ Anti-Flash Dark Mode (inline, runs before paint) ════════════════ -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <style>
      :root { --font-inter: 'Inter', sans-serif; }
      html, body {
        touch-action: pan-x pan-y;
      }
      body  {
        font-family: var(--font-inter), ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      /* First paint stays intentionally quiet: a clean background until React is ready. */
      #root { min-height: 100vh; background: #f8fafc; }
      html.dark #root { background: #020617; }

      /* Garantikan font-display: swap untuk semua @font-face Google Fonts yang dimuat */
      @font-face { font-family: 'Plus Jakarta Sans'; font-display: swap; }
      @font-face { font-family: 'Inter'; font-display: swap; }
      @font-face { font-family: 'JetBrains Mono'; font-display: swap; }
    </style>

  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Cegah pinch-to-zoom & double-tap zoom di mobile, KECUALI pada photo viewer -->
    <script>
      (function () {
        function isZoomAllowed(target) {
          return !!(target && (target.closest('[data-allow-zoom="true"]') || target.closest('.photo-zoom-container')));
        }
        document.addEventListener('gesturestart', function (e) {
          if (!isZoomAllowed(e.target)) e.preventDefault();
        }, { passive: false });
        document.addEventListener('gesturechange', function (e) {
          if (!isZoomAllowed(e.target)) e.preventDefault();
        }, { passive: false });
        document.addEventListener('gestureend', function (e) {
          if (!isZoomAllowed(e.target)) e.preventDefault();
        }, { passive: false });
        document.addEventListener('touchmove', function (e) {
          if (e.touches.length > 1 && !isZoomAllowed(e.target)) {
            e.preventDefault();
          }
        }, { passive: false });
        var lastTouch = 0;
        document.addEventListener('touchend', function (e) {
          var now = Date.now();
          if (now - lastTouch <= 300 && !isZoomAllowed(e.target)) {
            e.preventDefault();
          }
          lastTouch = now;
        }, { passive: false });
      })();
    </script>
  </body>
</html>
